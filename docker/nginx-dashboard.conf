server {
    listen 8363;
    server_name _;

    root /var/www/urfd-dashboard;
    index index.php;

    access_log /var/log/nginx/urfd-dashboard-access.log;
    error_log /var/log/nginx/urfd-dashboard-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The JSON API routes clean paths (/json/metadata, /json/status, ...) inside
    # json/index.php by matching REQUEST_URI. Upstream ships that rewrite as a
    # json/.htaccess, which nginx ignores, so without this block the generic
    # try_files above falls back to the dashboard's own index.php and every
    # endpoint answers 200 with an HTML page instead of JSON.
    # REQUEST_URI survives the internal redirect, so the PHP switch still matches.
    location /json/ {
        try_files $uri $uri/ /json/index.php;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    location ~ /\. {
        deny all;
    }
}
